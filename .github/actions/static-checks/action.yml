name: static-checks
description: >-
  The checks every Terraform project gets before any plan: format and validate,
  lint (tflint), security scan (trivy) and the organization's policies (conftest),
  including the one-region rule. Configuration and policies live next to this file.

inputs:
  terraform-version:
    description: Terraform version to install.
    required: false
    default: 1.16.4
  working-directory:
    description: The project root, the folder that holds terraform/ and definitions/.
    required: false
    default: .

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Install tflint, trivy and conftest
      shell: bash
      run: '"$GITHUB_ACTION_PATH/install.sh" tflint trivy conftest'

    - name: Static checks
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # tflint --init downloads the AWS ruleset from GitHub releases.
        GITHUB_TOKEN: ${{ github.token }}
        TF_IN_AUTOMATION: "true"
      run: '"$GITHUB_ACTION_PATH/run.sh"'
